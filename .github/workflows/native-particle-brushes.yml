name: Native particle brushes
on:
  push:
    branches: [main, feature/openbrush-native-brushes]
  pull_request:
    paths:
      - 'engine/render/include/voxen/render/OpenBrush*'
      - 'engine/render/shaders/openbrush_*'
      - 'tests/openbrush_*'
      - '.github/workflows/native-particle-brushes.yml'
jobs:
  native-brushes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Compile and run native brush geometry tests
        run: |
          set -euo pipefail
          for brush in smoke stars fire snow embers bubbles lightning neon_trails magic_dust; do
            src="tests/openbrush_${brush}_stroke.cpp"
            if [ -f "$src" ]; then
              g++ -std=c++17 -Wall -Wextra -Iengine/render/include "$src" -o "/tmp/test-${brush}"
              "/tmp/test-${brush}"
            fi
          done
      - name: Benchmark CPU mesh generation and packing
        run: |
          g++ -O2 -std=c++17 -Iengine/render/include tests/openbrush_particle_benchmark.cpp -o /tmp/particle-benchmark
          /tmp/particle-benchmark
      - name: Validate particle shaders
        run: |
          set -euo pipefail
          for shader in engine/render/shaders/openbrush_{fire,snow,embers,bubbles,lightning,neon_trails,magic_dust}.{vert,frag}; do
            if [ ! -f "$shader" ]; then continue; fi
            glslangValidator -V "$shader" -o /tmp/particle.spv
          done
